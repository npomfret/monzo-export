# Codex project config.
#
# Only loads when this project is trusted. Codex prompts to trust a directory
# on first use; alternatively add a [projects."<abs path>"] entry with
# trust_level = "trusted" to ~/.codex/config.toml.
#
# Per-command allow/prompt/deny lives in .codex/rules/project.rules

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Writes are confined to this directory tree.
network_access = true
